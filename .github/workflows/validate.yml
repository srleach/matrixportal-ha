name: Validate

# Two things that would otherwise only show up as a broken install:
# hassfest checks the manifest Home Assistant will load, and the HACS
# action checks the repository layout HACS will download.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # The brands check wants an entry in home-assistant/brands,
          # which is for integrations listed in the HACS default store.
          # This one is added as a custom repository, so there is nothing
          # to add there and nothing the check can tell us.
          ignore: brands
