name: Validate

# hassfest checks the manifest, HACS checks the repository layout, and
# Ruff catches syntax errors and undefined names. Neither of the first
# two caught the missing imports that prevented v0.2.0 from loading.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # E9 is the syntax and indentation set, F is pyflakes -- undefined
      # names (F821) and unused imports (F401). Deliberately narrow: this
      # is a correctness gate, not a style one.
      - run: ruff check --select E9,F --output-format github custom_components

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # The brands check wants an entry in home-assistant/brands,
          # which is for integrations listed in the HACS default store.
          # This one is added as a custom repository, so there is nothing
          # to add there and nothing the check can tell us.
          ignore: brands
