name: Validate

# Two things that would otherwise only show up as a broken install:
# hassfest checks the manifest Home Assistant will load, and the HACS
# action checks the repository layout HACS will download.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # Three checks this repository cannot satisfy, none of them
          # about the code:
          #
          #   brands              needs an entry in home-assistant/brands,
          #                       which is for publicly listed integrations
          #   hacsjson            reads hacs.json back through the GitHub
          #   integration_manifest  API rather than off disk, and gets
          #                       nothing for a private repository -- both
          #                       fail as "expected a dictionary. Got
          #                       None" even when the files are correct,
          #                       with or without a token
          #
          # The remaining five still run. hassfest above covers the
          # manifest properly, off disk, and is the one to trust.
          ignore: brands hacsjson integration_manifest
